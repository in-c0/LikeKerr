name: control-core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run sim
      - name: Verify real player fixture is reproducible
        run: |
          npm run derive:demo --silent > /tmp/likekerr-demo.csv
          diff -u data/demo/metrica-kloppy-player11.csv /tmp/likekerr-demo.csv
