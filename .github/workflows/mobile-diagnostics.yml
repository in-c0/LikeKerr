name: mobile-ble-diagnostics

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/control-core/src/bleHeartRate.ts"
      - "packages/control-core/src/ftms.ts"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/mobile-diagnostics.yml"

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm run check:mobile
      - run: npm run mobile:web
      - name: Generate Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: likekerr-ble-diagnostics-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
